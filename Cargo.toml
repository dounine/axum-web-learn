[package]
name = "axum-web-learn"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
config = {version = "0.15.23", features = ["yaml"]}
serde = {version = "1.0.228", features = ["derive"]}
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = {version = "1.52.3", features = ["macros", "rt-multi-thread"]}
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = {version = "0.3.23", features = ["env-filter"]}
